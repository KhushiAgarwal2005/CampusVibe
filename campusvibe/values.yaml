externalDatabase: {}

webapp:
  image:
    repository: reyrox2005/campusvibe
    tag: "19"

  replicaCount: 1

  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 60

  aiProvider: "HUGGINGFACE"

service:
  type: ClusterIP
  port: 80

serviceAccount:
  create: true
  annotations: {}
  name: ""

resources:
  limits:
    memory: 4Gi
    cpu: "500m"
  requests:
    memory: 2Gi
    cpu: "200m"
